```html
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #141e30, #243b55);
        }

        .calculadora {
            width: 350px;
            padding: 20px;
            background: #1e1e1e;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .pantalla {
            width: 100%;
            height: 90px;
            margin-bottom: 20px;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: #111;
            color: white;
            font-size: 38px;
            text-align: right;
            outline: none;
        }

        .botones {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            height: 65px;
            border: none;
            border-radius: 12px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
            background: #333;
            color: white;
            transition: 0.2s;
        }

        button:hover {
            background: #444;
            transform: scale(1.03);
        }

        button:active {
            transform: scale(0.95);
        }

        .operador {
            background: #ff9500;
        }

        .operador:hover {
            background: #ffad33;
        }

        .limpiar {
            background: #e63946;
        }

        .limpiar:hover {
            background: #ff5360;
        }

        .igual {
            background: #2a9d8f;
        }

        .igual:hover {
            background: #35b7a7;
        }

        .cero {
            grid-column: span 2;
        }
    </style>
</head>

<body>

    <div class="calculadora">

        <input 
            type="text" 
            id="pantalla" 
            class="pantalla" 
            value="0" 
            readonly
        >

        <div class="botones">

            <button class="limpiar" onclick="limpiar()">C</button>
            <button onclick="borrar()">⌫</button>
            <button onclick="agregar('%')">%</button>
            <button class="operador" onclick="agregar('/')">÷</button>

            <button onclick="agregar('7')">7</button>
            <button onclick="agregar('8')">8</button>
            <button onclick="agregar('9')">9</button>
            <button class="operador" onclick="agregar('*')">×</button>

            <button onclick="agregar('4')">4</button>
            <button onclick="agregar('5')">5</button>
            <button onclick="agregar('6')">6</button>
            <button class="operador" onclick="agregar('-')">−</button>

            <button onclick="agregar('1')">1</button>
            <button onclick="agregar('2')">2</button>
            <button onclick="agregar('3')">3</button>
            <button class="operador" onclick="agregar('+')">+</button>

            <button class="cero" onclick="agregar('0')">0</button>
            <button onclick="agregar('.')">.</button>
            <button class="igual" onclick="calcular()">=</button>

        </div>
    </div>

    <script>
        const pantalla = document.getElementById("pantalla");

        function agregar(valor) {
            if (pantalla.value === "0" || pantalla.value === "Error") {
                pantalla.value = valor;
            } else {
                pantalla.value += valor;
            }
        }

        function limpiar() {
            pantalla.value = "0";
        }

        function borrar() {
            if (
                pantalla.value.length === 1 ||
                pantalla.value === "Error"
            ) {
                pantalla.value = "0";
            } else {
                pantalla.value = pantalla.value.slice(0, -1);
            }
        }

        function calcular() {
            try {
                let expresion = pantalla.value;

                // Convertir porcentaje a decimal
                expresion = expresion.replace(
                    /(\d+(?:\.\d+)?)%/g,
                    "($1/100)"
                );

                // Verificar que solo existan caracteres permitidos
                if (!/^[0-9+\-*/().%\s]+$/.test(expresion)) {
                    throw new Error("Expresión no válida");
                }

                const resultado = Function(
                    '"use strict"; return (' + expresion + ')'
                )();

                if (!Number.isFinite(resultado)) {
                    throw new Error("Resultado no válido");
                }

                pantalla.value = resultado;
            } catch (error) {
                pantalla.value = "Error";
            }
        }

        // Permitir usar el teclado
        document.addEventListener("keydown", function(event) {

            const tecla = event.key;

            if (
                (tecla >= "0" && tecla <= "9") ||
                tecla === "+" ||
                tecla === "-" ||
                tecla === "*" ||
                tecla === "/" ||
                tecla === "." ||
                tecla === "%"
            ) {
                agregar(tecla);
            }

            if (tecla === "Enter" || tecla === "=") {
                calcular();
            }

            if (tecla === "Backspace") {
                borrar();
            }

            if (tecla === "Escape") {
                limpiar();
            }
        });
    </script>

</body>
</html>
